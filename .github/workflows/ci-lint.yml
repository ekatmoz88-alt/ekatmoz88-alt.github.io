name: "Prose Style & Markdown Gates"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  prose-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Запуск линтера Vale для проверки текстов в Markdown
      - name: Run Vale Prose Linter
        uses: errata-ai/vale-action@v2
        with:
          files: 'portfolio-*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
