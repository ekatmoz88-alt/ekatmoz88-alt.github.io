name: Java Portfolio CI

on:
  pull_request:
    paths:
      - "spring-app/**"
      - "render.yaml"
      - ".github/workflows/java-portfolio-ci.yml"
  push:
    branches: [main]
    paths:
      - "spring-app/**"
      - "render.yaml"
      - ".github/workflows/java-portfolio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify application
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Build Docker image
        working-directory: .
        run: docker build -t kate-mo-portfolio -f spring-app/Dockerfile spring-app
