name: Java Portfolio CI

on:
  pull_request:
    paths:
      - "spring-app/**"
      - "render.yaml"
      - ".github/workflows/java-portfolio-ci.yml"
  push:
    branches: [main]
    paths:
      - "spring-app/**"
      - "render.yaml"
      - ".github/workflows/java-portfolio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify application
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Build Docker image
        working-directory: .
        run: docker build -t kate-mo-portfolio -f spring-app/Dockerfile spring-app
      - name: Run Docker smoke test
        working-directory: .
        run: |
          set -eu
          docker run -d --name kate-mo-portfolio-smoke -p 8080:8080 kate-mo-portfolio
          cleanup() {
            docker logs kate-mo-portfolio-smoke || true
            docker rm -f kate-mo-portfolio-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health >/tmp/portfolio-health.json; then
              cat /tmp/portfolio-health.json
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Application did not become healthy within 60 seconds."
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://localhost:8080/ | grep -q "Technical documentation"
          echo "Docker smoke test passed: health endpoint and portfolio landing page responded."
